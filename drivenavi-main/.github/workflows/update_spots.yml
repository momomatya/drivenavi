name: Update Spots Data

on:
  schedule:
    # 毎週日曜日の 18:00 UTC（日本時間の月曜日 午前3:00）に自動実行
    - cron: '0 18 * * 0'
  # GitHubのActionsタブから手動でいつでも実行できるトリガー
  workflow_dispatch:

permissions:
  contents: write  # 更新したJSONファイルをリポジトリへコミット＆プッシュする権限

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: スポット収集スクリプトの実行
        run: |
          python scripts/fetch_spots.py

      - name: 生成された data/spots.json をコミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/spots.json

          # 差分がある場合のみコミットし、リモート履歴を取り込んでプッシュ
          if git diff --staged --quiet; then
            echo "変更差分はありませんでした。"
          else
            git commit -m "chore: 自動更新 - data/spots.json [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
