<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Concierge - 38 Racing</title>
    <!-- Tailwind CSS for Cyberpunk / Cockpit Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .cyber-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

    <!-- Header -->
    <header class="w-full max-w-md mx-auto cyber-card rounded-xl p-4 mb-4 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black tracking-wider text-sky-400">DRIVE CONCIERGE</h1>
            <p class="text-xs text-slate-400">38 Racing Copilot System</p>
        </div>
        <div id="status-display" class="text-xs bg-slate-800 text-sky-300 px-2 py-1 rounded border border-sky-500/30">
            スタンバイ中
        </div>
    </header>

    <!-- Main Cockpit Display -->
    <main class="w-full max-w-md mx-auto flex-1 flex flex-col gap-4 mb-4">
        
        <!-- Speed & Radar Box -->
        <div class="cyber-card rounded-2xl p-6 text-center relative overflow-hidden">
            <div class="absolute top-2 right-2 text-[10px] tracking-widest text-sky-400 uppercase font-mono">Speedometer</div>
            <div class="text-6xl font-black tracking-tighter text-white mt-2">
                <span id="speed-display">0</span>
                <span class="text-lg font-normal text-slate-400 ml-1">km/h</span>
            </div>
            <div class="mt-4 pt-4 border-t border-slate-800 flex justify-around text-sm">
                <div>
                    <span class="text-slate-400 block text-xs">検索半径</span>
                    <span id="radius-display" class="font-bold text-sky-300">5.0 km</span>
                </div>
                <div>
                    <span class="text-slate-400 block text-xs">周辺スポット</span>
                    <span id="spot-count" class="font-bold text-emerald-400">0 件</span>
                </div>
            </div>
        </div>

        <!-- Tsumugi Voice Status / Log -->
        <div class="cyber-card rounded-xl p-4 flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <div class="flex-1">
                <p class="text-xs text-slate-400">つむぎ音声システム</p>
                <p id="voice-status-text" class="text-sm font-medium text-slate-200">システム待機中...</p>
            </div>
        </div>

        <!-- Nearby Spots List -->
        <div class="cyber-card rounded-xl p-4 flex-1 flex flex-col">
            <h2 class="text-sm font-bold text-sky-400 mb-2 border-b border-slate-800 pb-1">周辺のレコメンド・スポット</h2>
            <div id="spot-list" class="flex-1 overflow-y-auto space-y-2 max-h-48 text-xs text-slate-300">
                <p class="text-slate-500 text-center py-4">ドライブを開始すると周辺スポットが表示されます</p>
            </div>
        </div>

    </main>

    <!-- Footer Controls -->
    <footer class="w-full max-w-md mx-auto">
        <button id="start-btn" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-black py-4 rounded-xl shadow-lg shadow-sky-500/25 transition-all text-lg tracking-wider">
            ドライブを開始
        </button>
    </footer>

    <!-- App Logic Script -->
    <script src="app.js"></script>
</body>
</html>
