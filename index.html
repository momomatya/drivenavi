<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Drive Concierge - Roadster Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* SFコックピット調のディープブルー＆サイバーシアン基調 */
    body {
      background-color: #060b13;
      background-image: 
        linear-gradient(rgba(10, 20, 35, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
        linear-gradient(90deg, rgba(0, 150, 255, 0.03), rgba(0, 255, 200, 0.01), rgba(0, 100, 255, 0.03));
      background-size: 100% 4px, 6px 100%;
      color: #00d2ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    /* ブルー仕様のサイバーハザードバー */
    .hazard-bar {
      background: repeating-linear-gradient(
        -45deg,
        #00aaff,
        #00aaff 10px,
        #041224 10px,
        #041224 20px
      );
      height: 6px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 4px;
    }

    /* 最上部ステータスヘッダー */
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 0 8px 0;
      border-bottom: 2px solid #0088cc;
      padding-bottom: 6px;
    }
    
    h1 {
      font-size: 1.05rem;
      font-weight: 800;
      color: #00f0ff;
      cursor: pointer;
      user-select: none;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .top-badge-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .status-badge {
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #09131f;
      border: 1px solid #103350;
      color: #5588aa;
    }
    .status-badge.active {
      background: #004466;
      color: #00ffcc;
      border-color: #00ffcc;
      animation: blink 1s infinite alternate;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
    }

    /* メインカード */
    .card {
      width: 100%;
      max-width: 480px;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #09121d;
      border-radius: 12px;
      padding: 14px;
      border: 2px solid #0077b6;
      justify-content: space-between;
      gap: 12px;
      box-shadow: inset 0 0 30px rgba(0, 150, 255, 0.15);
      position: relative;
    }

    /* 2重円弧ゲージ */
    .gauge-container {
      position: relative;
      width: 100%;
      height: 105px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      margin-top: -6px;
    }

    .gauge-track {
      position: absolute;
      width: 170px;
      height: 85px;
      border: 10px double #0d2844;
      border-bottom: none;
      border-top-left-radius: 85px;
      border-top-right-radius: 85px;
      bottom: 0;
    }
    
    .gauge-active {
      position: absolute;
      width: 170px;
      height: 85px;
      border: 10px double #00d2ff;
      border-bottom: none;
      border-top-left-radius: 85px;
      border-top-right-radius: 85px;
      bottom: 0;
      clip-path: inset(0 0 0 0);
      filter: drop-shadow(0 0 6px #00aaff);
    }

    .gauge-value-box {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 2px;
    }
    .distance-label {
      font-size: 0.65rem;
      font-weight: 800;
      color: #5599cc;
      letter-spacing: 2px;
    }
    .distance-num {
      font-size: 1.8rem;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
      font-family: "Impact", sans-serif;
    }

    /* スポット名称枠 */
    .spot-info {
      text-align: center;
      border: 2px solid #0088cc;
      background: #081829;
      padding: 8px 6px;
      position: relative;
    }
    .spot-info::before {
      content: "[ 最寄りスポット ]";
      display: block;
      font-size: 0.65rem;
      color: #00d2ff;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }
    .spot-name {
      font-size: 1.3rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.25;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.7);
    }

    /* 吹き出し */
    .speech-bubble {
      background: #0a1b2d;
      border-radius: 8px;
      padding: 14px 12px;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.45;
      color: #e2f1ff;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 2px solid #005f9e;
      box-shadow: inset 0 0 15px rgba(0, 119, 182, 0.25);
      position: relative;
    }
    .speech-bubble::after {
      content: "VOICEVOX: KASUKABE TSUMUGI // ACTIVE";
      position: absolute;
      bottom: 4px;
      font-size: 0.55rem;
      color: #1e456d;
      letter-spacing: 0.5px;
    }

    /* マイク・スピード状況バッジ */
    .sub-status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #8da4be;
      padding: 0 4px;
    }

    /* もう一度聞くボタン */
    .replay-btn {
      width: 100%;
      padding: 8px;
      border: 1.5px solid #0077b6;
      background: #091a2e;
      color: #00d2ff;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .replay-btn:active {
      background: #0077b6;
      color: #ffffff;
    }

    /* 巨大分割アクションボタン */
    .action-group {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 12px;
      height: 75px;
    }
    .btn {
      border: 2px solid;
      border-radius: 12px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .btn:active {
      transform: scale(0.96);
    }
    
    .btn-yes {
      background: #032b1a;
      border-color: #00ff88;
      color: #00ff88;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.25);
    }
    .btn-yes::before {
      content: "MAP経路案内";
      font-size: 0.6rem;
      color: #00cc6a;
      letter-spacing: 1px;
    }
    .btn-yes .btn-title {
      font-size: 1.4rem;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.7);
    }

    .btn-no {
      background: #101c2b;
      border-color: #2b4c6f;
      color: #8da4be;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    }
    .btn-no::before {
      content: "次の候補へ";
      font-size: 0.6rem;
      color: #5d7591;
      letter-spacing: 1px;
    }
    .btn-no .btn-title {
      font-size: 1.2rem;
    }

    /* 案内スタート / 停止トグル (IDを toggleNavBtn に完全合致) */
    .nav-toggle {
      width: 100%;
      max-width: 480px;
      padding: 14px;
      border-radius: 8px;
      background: #0b1a2d;
      border: 2px solid #0077b6;
      color: #00d2ff;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      letter-spacing: 1px;
      box-shadow: inset 0 0 12px rgba(0, 119, 182, 0.2);
    }
    .nav-toggle.running {
      background: #8b0000;
      border-color: #ff3333;
      color: #ffffff;
      animation: blink 0.8s infinite alternate;
      box-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
    }

    @keyframes blink {
      from { opacity: 1; }
      to { opacity: 0.8; }
    }
  </style>
</head>
<body>

  <!-- ブルーサイバーハザード帯 -->
  <div class="hazard-bar"></div>

  <header>
    <h1 id="appTitle">Drive Concierge</h1>
    <div class="top-badge-group">
      <button id="modeToggleBtn" class="status-badge" style="cursor: pointer;">MODE: 通常</button>
      <span id="statusBadge" class="status-badge">読込中</span>
    </div>
  </header>

  <div class="card">
    <!-- 2重円弧距離ゲージ -->
    <div class="gauge-container">
      <div class="gauge-track"></div>
      <div id="gaugeActive" class="gauge-active"></div>
      <div class="gauge-value-box">
        <div class="distance-label">DISTANCE</div>
        <div id="spotDistance" class="distance-num">---</div>
      </div>
    </div>

    <!-- スポット名称 -->
    <div class="spot-info">
      <div id="spotName" class="spot-name">待機中 (全1200件連携)</div>
    </div>

    <!-- 特大セリフ吹き出し -->
    <div id="speechText" class="speech-bubble">
      「ドライブを開始」を押すと、速度に応じた索敵とつむぎ音声案内がスタートします。
    </div>

    <!-- マイク・速度ステータス -->
    <div class="sub-status-bar">
      <span id="micStatus">🎤 音声スタンバイ</span>
      <span id="speedStatus">0 km/h | 索敵: 5.0km</span>
    </div>

    <!-- もう一度聞く -->
    <button id="btnReplay" class="replay-btn">
      <span>🔊</span> もう一度聞く / 音声リトライ
    </button>

    <!-- 巨大分割アクションボタン -->
    <div class="action-group">
      <button id="btnYes" class="btn btn-yes">
        <span class="btn-title">寄る！</span>
      </button>
      <button id="btnNo" class="btn btn-no">
        <span class="btn-title">パス</span>
      </button>
    </div>
  </div>

  <button id="toggleNavBtn" class="nav-toggle">▶ ドライブを開始</button>

  <!-- アプリのメインロジック (app.js) -->
  <script src="app.js"></script>
</body>
</html>
