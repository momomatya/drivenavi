<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Drive Concierge - Roadster Edition</title>
  
  <link rel="icon" href="data:,">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #060b13;
      background-image: 
        linear-gradient(rgba(10, 20, 35, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
        linear-gradient(90deg, rgba(0, 150, 255, 0.03), rgba(0, 255, 200, 0.01), rgba(0, 100, 255, 0.03));
      background-size: 100% 4px, 6px 100%;
      color: #00d2ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    .hazard-bar {
      background: repeating-linear-gradient(-45deg, #00aaff, #00aaff 10px, #041224 10px, #041224 20px);
      height: 6px; width: 100%; max-width: 480px; margin-bottom: 6px;
    }

    header {
      width: 100%; max-width: 480px; display: flex; justify-content: space-between;
      align-items: center; margin: 4px 0 8px 0; border-bottom: 2px solid #0088cc; padding-bottom: 6px;
    }
    
    h1 {
      font-size: 1.05rem; font-weight: 800; color: #00f0ff; letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); cursor: pointer; user-select: none;
    }

    .top-badge-group { display: flex; gap: 5px; align-items: center; }

    .persona-btn {
      background: #09131f; border: 1px solid #103350; color: #6699cc; padding: 4px 8px;
      border-radius: 4px; font-size: 0.72rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
    }
    .persona-btn.selected {
      background: #004466; border-color: #00d2ff; color: #00f0ff; box-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
    }

    #btnPersonaKanojo { display: none; }
    header.secret-unlocked #btnPersonaKanojo {
      display: inline-block; animation: unlockGlow 0.4s ease-out;
    }
    #btnPersonaKanojo.selected {
      background: #e6005c !important; border-color: #ff3388 !important; color: #ffffff !important;
      box-shadow: 0 0 10px rgba(255, 51, 136, 0.7) !important;
    }

    @keyframes unlockGlow {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 8px #ff3388); }
      100% { transform: scale(1); opacity: 1; }
    }

    .status-badge {
      padding: 4px 8px; border-radius: 4px; font-size: 0.72rem; font-weight: 700;
      background: #09131f; border: 1px solid #103350; color: #5588aa;
    }
    .status-badge.active {
      background: #004466; color: #00ffcc; border-color: #00ffcc; box-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
    }

    .card {
      width: 100%; max-width: 480px; flex: 1; display: flex; flex-direction: column;
      background: #09121d; border-radius: 12px; padding: 14px; border: 2px solid #0077b6;
      justify-content: space-between; gap: 12px; box-shadow: inset 0 0 30px rgba(0, 150, 255, 0.15);
      position: relative;
    }

    .gauge-container {
      position: relative; width: 100%; height: 95px; display: flex;
      flex-direction: column; justify-content: flex-end; align-items: center; margin-top: -4px;
    }
    .gauge-track {
      position: absolute; width: 160px; height: 80px; border: 10px double #0d2844;
      border-bottom: none; border-top-left-radius: 80px; border-top-right-radius: 80px; bottom: 0;
    }
    .gauge-active {
      position: absolute; width: 160px; height: 80px; border: 10px double #00d2ff;
      border-bottom: none; border-top-left-radius: 80px; border-top-right-radius: 80px;
      bottom: 0; clip-path: inset(0 0 0 0); filter: drop-shadow(0 0 6px #00aaff);
    }
    .gauge-value-box { position: relative; z-index: 2; text-align: center; margin-bottom: 2px; }
    .distance-label { font-size: 0.65rem; font-weight: 800; color: #5599cc; letter-spacing: 2px; }
    .distance-num { font-size: 1.7rem; font-weight: 900; color: #00f0ff; text-shadow: 0 0 12px rgba(0, 240, 255, 0.6); font-family: "Impact", sans-serif; }

    .spot-info {
      text-align: center; border: 2px solid #0088cc; background: #081829;
      padding: 8px 6px; position: relative;
    }
    .spot-info::before {
      content: "[ 最寄りスポット ]"; display: block; font-size: 0.65rem; color: #00d2ff; margin-bottom: 4px; letter-spacing: 1px;
    }
    .spot-name { font-size: 1.25rem; font-weight: 900; color: #ffffff; line-height: 1.25; text-shadow: 0 0 10px rgba(0, 210, 255, 0.7); }

    .speech-bubble {
      background: #0a1b2d; border-radius: 8px; padding: 14px 12px; font-size: 1.02rem;
      font-weight: 700; line-height: 1.45; color: #e2f1ff; min-height: 90px; display: flex;
      flex-direction: column; align-items: center; justify-content: center; text-align: center;
      border: 2px solid #005f9e; box-shadow: inset 0 0 15px rgba(0, 119, 182, 0.25); position: relative;
    }
    .speech-bubble::after {
      content: "STATUS: ACTIVE // DRIVE_CONCIERGE"; position: absolute; bottom: 4px; font-size: 0.55rem; color: #2b5580; letter-spacing: 0.5px;
    }

    .replay-btn {
      width: 100%; padding: 8px; border: 1.5px solid #0077b6; background: #091a2e;
      color: #00d2ff; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .replay-btn:active { background: #0077b6; color: #ffffff; }

    .action-group { display: grid; grid-template-columns: 1.35fr 1fr; gap: 12px; height: 75px; }
    .btn {
      border: 2px solid; border-radius: 12px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    .btn:active { transform: scale(0.96); }
    
    .btn-yes { background: #032b1a; border-color: #00ff88; color: #00ff88; box-shadow: 0 0 15px rgba(0, 255, 136, 0.25); }
    .btn-yes::before { content: "MAP経路案内"; font-size: 0.6rem; color: #00cc6a; letter-spacing: 1px; }
    .btn-yes .btn-title { font-size: 1.35rem; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 255, 136, 0.7); }

    .btn-no { background: #101c2b; border-color: #2b4c6f; color: #8da4be; box-shadow: 0 0 10px rgba(0, 0, 0, 0.3); }
    .btn-no::before { content: "次の候補へ"; font-size: 0.6rem; color: #5d7591; letter-spacing: 1px; }
    .btn-no .btn-title { font-size: 1.15rem; }

    .nav-toggle {
      width: 100%; max-width: 480px; padding: 13px; border-radius: 8px; background: #0b1a2d;
      border: 2px solid #0077b6; color: #00d2ff; font-size: 1.05rem; font-weight: 800; cursor: pointer;
      margin-top: 8px; letter-spacing: 1px; box-shadow: inset 0 0 12px rgba(0, 119, 182, 0.2);
    }
    .nav-toggle.running {
      background: #8b0000; border-color: #ff3333; color: #ffffff; box-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
    }
  </style>
</head>
<body>

  <div class="hazard-bar"></div>

  <header id="mainHeader">
    <h1 id="appTitle">ドライブコンシェルジュ</h1>
    <div class="top-badge-group">
      <button id="btnPersonaTsure" class="persona-btn selected">ツレ</button>
      <button id="btnPersonaDj" class="persona-btn">FM-DJ</button>
      <button id="btnPersonaKanojo" class="persona-btn">彼女</button>
      <span id="statusBadge" class="status-badge">読込中</span>
    </div>
  </header>

  <div class="card">
    <div class="gauge-container">
      <div class="gauge-track"></div>
      <div id="gaugeActive" class="gauge-active"></div>
      <div class="gauge-value-box">
        <div class="distance-label">DISTANCE</div>
        <div id="spotDistance" class="distance-num">---</div>
      </div>
    </div>

    <div class="spot-info">
      <div id="spotName" class="spot-name">待機中</div>
    </div>

    <div id="speechText" class="speech-bubble">
      「走行案内をスタート」を押すと、近くの立ち寄りスポットをお知らせします。
    </div>

    <button id="btnReplay" class="replay-btn">
      <span>🔊</span> もう一度聞く
    </button>

    <div class="action-group">
      <button id="btnYes" class="btn btn-yes">
        <span class="btn-title">寄る！</span>
      </button>
      <button id="btnNo" class="btn btn-no">
        <span class="btn-title">パス</span>
      </button>
    </div>
  </div>

  <button id="toggleNavBtn" class="nav-toggle">走行案内をスタート</button>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      console.log("Drive Concierge initialized.");

      const toggleNavBtn = document.getElementById('toggleNavBtn');
      const statusBadge = document.getElementById('statusBadge');
      const spotDistance = document.getElementById('spotDistance');
      const gaugeActive = document.getElementById('gaugeActive');
      const spotName = document.getElementById('spotName');
      const speechText = document.getElementById('speechText');
      const btnReplay = document.getElementById('btnReplay');
      const btnYes = document.getElementById('btnYes');
      const btnNo = document.getElementById('btnNo');

      const mainHeader = document.getElementById('mainHeader');
      const appTitle = document.getElementById('appTitle');
      const btnPersonaTsure = document.getElementById('btnPersonaTsure');
      const btnPersonaDj = document.getElementById('btnPersonaDj');
      const btnPersonaKanojo = document.getElementById('btnPersonaKanojo');

      let isRunning = false;
      let watchId = null;
      let currentSpeed = 0;
      
      let allSpots = [];
      let currentNearestSpot = null;
      let announcedSpotId = null;
      let skippedSpotIds = new Set();
      let currentPersona = "tsure"; 

      // 1. 全国スポットデータのロード
      async function loadDatasets() {
        try {
          statusBadge.textContent = "読込中...";
          const res = await fetch('./places_spots.json');
          allSpots = await res.json();
          statusBadge.textContent = `${allSpots.length}件`;
          statusBadge.classList.add('active');
        } catch (e) {
          console.error("データロードエラー:", e);
          statusBadge.textContent = "読込失敗";
        }
      }
      loadDatasets();

      // 2. タイトル5回タップによるシークレットコマンド
      let tapCount = 0;
      let tapTimer = null;

      appTitle.addEventListener('click', () => {
        tapCount++;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => { tapCount = 0; }, 2500);

        if (tapCount >= 5) {
          tapCount = 0;
          unlockKanojoSecret();
        }
      });

      function unlockKanojoSecret() {
        if (!mainHeader.classList.contains('secret-unlocked')) {
          mainHeader.classList.add('secret-unlocked');
          setPersona('kanojo', true);
        } else {
          setPersona('kanojo');
        }
      }

      // 3. ペルソナ切り替え
      function setPersona(persona, isSecretUnlock = false) {
        currentPersona = persona;
        
        btnPersonaTsure.classList.toggle('selected', persona === 'tsure');
        btnPersonaDj.classList.toggle('selected', persona === 'dj');
        btnPersonaKanojo.classList.toggle('selected', persona === 'kanojo');

        if (persona === 'tsure') {
          playVoice('sys_unlock.mp3', '「おっ、野郎ドライブだな！安全第一で行くぞ！」');
        } else if (persona === 'dj') {
          playVoice('sys_unlock.mp3', '「Yo! Drive Conciergeへようこそ。最高のグルーブを届けちゃうぜ！」');
        } else if (persona === 'kanojo') {
          if (isSecretUnlock) {
            playVoice('sys_unlock.mp3', '「【シークレット解除】お待たせ！つむぎだよ！内緒で一緒にドライブ行こ？」');
          } else {
            playVoice('sys_unlock.mp3', '「お待たせ！ドライブコンシェルジュ、つむぎだよ！今日も安全運転で楽しく行こうね！」');
          }
        }
      }

      btnPersonaTsure.addEventListener('click', () => setPersona('tsure'));
      btnPersonaDj.addEventListener('click', () => setPersona('dj'));
      btnPersonaKanojo.addEventListener('click', () => setPersona('kanojo'));

      // 4. 音声再生処理（ブラウザ音声フォールバック付き）
      function playVoice(voiceFile, displayMessage = "") {
        if (displayMessage) {
          speechText.textContent = displayMessage;
        }

        const audioPath = `./audio/${voiceFile}`;
        const audio = new Audio(audioPath);
        
        audio.play().then(() => {
          console.log(`音声再生成功: ${audioPath}`);
        }).catch(err => {
          console.warn(`音声再生不可 (${audioPath})、ブラウザ音声でフォールバック:`, err);
          if ('speechSynthesis' in window && displayMessage) {
            const uttr = new SpeechSynthesisUtterance(displayMessage.replace(/^[「『]|[!！?？]*[」』]$/g, ''));
            uttr.lang = 'ja-JP';
            window.speechSynthesis.speak(uttr);
          }
        });
      }

      // 5. 走行案内スタート / 停止
      toggleNavBtn.addEventListener('click', () => {
        isRunning = !isRunning;

        if (isRunning) {
          toggleNavBtn.textContent = "走行案内を停止";
          toggleNavBtn.classList.add('running');
          statusBadge.textContent = "追従中";
          spotName.textContent = "現在地を測位中...";
          
          if (currentPersona === 'kanojo') {
            playVoice('sys_unlock.mp3', '「今日も安全運転で楽しく行こうね！」');
          } else if (currentPersona === 'dj') {
            playVoice('sys_unlock.mp3', '「ナビゲーション・スタート！グッドバイブスで行こう！」');
          } else {
            playVoice('sys_unlock.mp3', '「よし、出発だな！飛ばしすぎんなよー！」');
          }

          startGeolocation();
        } else {
          stopGeolocation();
          toggleNavBtn.textContent = "走行案内をスタート";
          toggleNavBtn.classList.remove('running');
          statusBadge.textContent = `${allSpots.length}件`;
          speechText.textContent = "走行案内を一時停止しました。";
          spotName.textContent = "待機中";
        }
      });

      // 6. GPSトラッキング
      function startGeolocation() {
        if (!('geolocation' in navigator)) {
          alert("このブラウザは位置情報に対応していません。");
          return;
        }

        watchId = navigator.geolocation.watchPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            currentSpeed = position.coords.speed ? position.coords.speed * 3.6 : 0;
            let searchRadius = currentSpeed >= 80 ? 25.0 : (currentSpeed >= 50 ? 15.0 : 10.0);
            processNearbySpots(lat, lng, searchRadius);
          },
          (error) => {
            console.error("GPSエラー:", error);
            statusBadge.textContent = "GPSエラー";
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
        );
      }

      function stopGeolocation() {
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
      }

      // 7. 周辺スポット探索 & 案内
      function processNearbySpots(lat, lng, radiusKm) {
        if (!allSpots || allSpots.length === 0) return;

        let nearest = null;
        let minDistance = 999999;

        for (const spot of allSpots) {
          if (!spot.lat || !spot.lng || skippedSpotIds.has(spot.id)) continue;
          const dist = calcDistance(lat, lng, spot.lat, spot.lng);
          if (dist < minDistance) {
            minDistance = dist;
            nearest = spot;
          }
        }

        if (nearest && minDistance <= radiusKm) {
          currentNearestSpot = nearest;
          const distMeters = Math.round(minDistance * 1000);
          
          spotName.textContent = nearest.name || "名称不明スポット";
          spotDistance.textContent = minDistance < 1 ? `${distMeters}m` : `${minDistance.toFixed(1)}km`;

          let gaugePercent = Math.max(0, Math.min(100, (1 - (minDistance / radiusKm)) * 100));
          if (gaugeActive) gaugeActive.style.clipPath = `inset(${100 - gaugePercent}% 0 0 0)`;

          if (announcedSpotId !== nearest.id) {
            announcedSpotId = nearest.id;
            announceCurrentSpot(nearest);
          }
        } else {
          currentNearestSpot = null;
          spotName.textContent = "周辺にスポットなし";
          spotDistance.textContent = "---";
          if (gaugeActive) gaugeActive.style.clipPath = `inset(100% 0 0 0)`;
        }
      }

      function announceCurrentSpot(spot) {
        if (!spot) return;
        const dialogueText = spot.dialogue?.[currentPersona] || spot.dialogue?.kanojo || `「まもなく、${spot.name} です。寄っていきますか？」`;
        const voiceFile = spot.voice_file || `${spot.id}.mp3`;
        playVoice(voiceFile, dialogueText);
      }

      function calcDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      // 8. アクションボタン
      btnYes.addEventListener('click', () => {
        if (currentNearestSpot && currentNearestSpot.lat && currentNearestSpot.lng) {
          playVoice('sys_nav_ok.mp3', '「わかった！ナビを開くね！」');
          setTimeout(() => {
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${currentNearestSpot.lat},${currentNearestSpot.lng}`, '_blank');
          }, 1200);
        } else {
          playVoice('sys_nav_err.mp3', '「まだスポットを案内してないよ！」');
        }
      });

      btnNo.addEventListener('click', () => {
        if (currentNearestSpot) {
          skippedSpotIds.add(currentNearestSpot.id); 
          currentNearestSpot = null; 
          announcedSpotId = null;
        }
        playVoice('sys_mute.mp3', '「わかった、しばらく静かにしてるね！」');
      });

      btnReplay.addEventListener('click', () => {
        if (currentNearestSpot) { 
          announceCurrentSpot(currentNearestSpot); 
        } else { 
          playVoice('sys_unlock.mp3', '「今日も安全運転で楽しく行こうね！」'); 
        }
      });
    });
  </script>
</body>
</html>
